#####################################################################
[output_pin caselights] ; FAN3 GPIO17 - Chamber lighting
#####################################################################
pin:                        gpio17
pwm:                        True
cycle_time:                 0.02506                            ; 39.9Hz - reduce flickering COB leds
shutdown_value:             0
value:                      1.0 

#####################################################################
[gcode_macro LIGHTS] ; toggle lights between preferred levels
#####################################################################

gcode:
    {% if printer['output_pin caselights'].value > 0 %}
         SET_PIN PIN=caselights VALUE=0
    {% else %}
         SET_PIN PIN=caselights VALUE=1
    {% endif %}

