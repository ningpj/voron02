[mmu_leds unit0]
entry_leds    : neopixel:_unit0_gate0_box (1)
                neopixel:_unit0_gate1_box (1)
                neopixel:_unit0_gate2_box (1)
                neopixel:_unit0_gate3_box (1)
exit_leds     : neopixel:_unit0_gate0_leds (1,2,3,4)
                neopixel:_unit0_gate1_leds (1,2,3,4)
                neopixel:_unit0_gate2_leds (1,2,3,4)
                neopixel:_unit0_gate3_leds (1,2,3,4)
status_leds   : 
logo_leds     : 
frame_rate    : 15

# Default effects for LED segments when not providing action status
#    off            - LED's off
#    on             - LED's white
#    gate_status    - indicate gate availability / status            (printer.mmu.gate_status)
#    filament_color - display filament color defined in gate map     (printer.mmu.gate_color_rgb)
#    slicer_color   - display slicer defined set color for each gate (printer.mmu.slicer_color_rgb)
#   (r,g,b)         - display static r,g,b color e.g. "0,0,0.3" for dim blue
#    _effect_       - display the named led effect
#
enabled       : True			# True = LEDs are enabled at startup (MMU_LED can control), False = Disabled
animation     : True			# True = Use led-animation-effects, False = Static LEDs
exit_effect   : gate_status		# off|   gate_status|filament_color|slicer_color|r,g,b|_effect_
entry_effect  : filament_color		# off|   gate_status|filament_color|slicer_color|r,g,b|_effect_
status_effect : filament_color		# on|off|            filament_color|slicer_color|r,g,b|_effect_
logo_effect   : (0, 0, 0.3)		# off                                           |r,g,b|_effect_
white_light   : (1, 1, 1)		# RGB color for static white light
black_light   : (.01, 0, .02)		# RGB color used to represent "black" (filament)
empty_light   : (0, 0, 0)		# RGB color used to represent empty gate
filament_color_intensity: 0.2		# Intensity reduction when displaying filament or slicer color

# Default effects (animation: True) / static rbg (animation False) to apply to actions
#   effect_name, (r,g,b) [, duration]
# The optional 'duration' (seconds) sets how long a timed/transient effect shows before
# reverting to the default. Omit it for effects that aren't timed (it can still be overridden
# at runtime). An explicit duration passed by code takes precedence over this default.
#
# IMPORTANT: Effects must be defined by [mmu_led_effect] in mmu.cfg or below
#
effect_loading                  : mmu_blue_clockwise_fast,   (0, 0, 0.4)
effect_loading_extruder         : mmu_blue_clockwise_slow,   (0, 0, 1)
effect_unloading                : mmu_blue_anticlock_fast,   (0, 0, 0.4)
effect_unloading_extruder       : mmu_blue_anticlock_slow,   (0, 0, 1)
effect_heating                  : mmu_breathing_red_slow,    (0.3, 0, 0)
effect_selecting                : mmu_breathing_white_fast,  (0.2, 0.2, 0.2)
effect_checking                 : mmu_breathing_white_fast,  (0.8, 0.8, 0.8)
effect_preloading               : mmu_breathing_cyan_fast,   (0, 0.4, 0.5)
effect_initialized              : mmu_rainbow,               (0.5, 0.2, 0),   8
effect_error                    : mmu_red_strobe,            (1, 0, 0),       10
effect_complete                 : mmu_sparkle,               (0.3, 0.3, 0.3), 10
effect_gate_selected            : mmu_static_blue,           (0, 0, 1)
effect_gate_available           : mmu_static_white_dim_unit0, (0.1, 0.1, 0.1)
effect_gate_available_sel       : mmu_static_white_unit0,    (0.75, 0.75, 0.75)
effect_gate_unknown             : mmu_static_orange,         (0.5, 0.2, 0)
effect_gate_unknown_sel         : mmu_ready_orange,          (0.55, 0.3, 0)
effect_gate_empty               : mmu_static_black,          (0, 0, 0)
effect_gate_empty_sel           : mmu_static_red_unit0,      (0.2, 0, 0)

# Pending spool_id overlay fires for all uses of MMU_GATE_MAP NEXT_SPOOLID (manual and NFC).
# Shown on the segment(s) chosen by 'spoolman_led_segment' (mmu.cfg)
effect_pending_spoolid          : mmu_breathing_purple_slow, (0.4, 0, 0.5)
effect_pending_spoolid_expiring : mmu_breathing_purple_fast, (0.4, 0, 0.5)

# NFC/RFID reader indicators (only fire when a reader is present).
# Shown on the segment(s) chosen by 'nfc_led_segment' (mmu_unit_parameters.cfg)
effect_nfc_read                 : mmu_green_strobe_fast,     (0, 1, 0),       0.8
effect_nfc_deep_read            : mmu_green_strobe_fast,     (0, 1, 0),       1.6
effect_nfc_fail                 : mmu_red_strobe,            (1, 0, 0),       3

# TD-1 scanner indicators (only fire when a scanner is present).
# Shown on the segment(s) chosen by 'td1_led_segment' (mmu_parameters.cfg)
effect_td1_read                 : mmu_green_strobe_fast,     (0, 1, 0),       0.8
effect_td1_fail                 : mmu_red_strobe,            (1, 0, 0),       3

# Additional effects used by this unit
[mmu_led_effect mmu_static_white_unit0]
unit      : unit0
define_on : gates, exit
layers    : static 0 0 top (1.0,1.0,1.0, 1.0)

[mmu_led_effect mmu_static_white_dim_unit0]
unit      : unit0
define_on : gates, exit
layers    : static 0 0 top (0.1,0.1,0.1, 0.1)

[mmu_led_effect mmu_static_red_unit0]
unit      : unit0
define_on : gates, exit
layers    : static 0 0 top (0.5,0.0,0.0)
