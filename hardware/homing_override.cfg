#####################################################################
[homing_override] ; override homing for voron v0.2
#####################################################################

axes:                       xyz
;set_position_z:            0                                    ; NOTE: this invalidated Z home status. homing_override changed to skip Z safety move to allow individual axis's to be homed. Not really needed on v0.2 as QGL/tilt not required  
gcode:

   _MSG PREFIX=🏠 MSG="Homing ..."
   _set_neos NEOCHAIN=bed_neo STATUS=homing
   
   {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
   
   {% if home_all or 'Z' in params %}                            ; home z first to get bed out of the way
      _HOME_Z
   {% endif %}
  
   {% if home_all or 'X' in params %}
      _HOME_X
   {% endif %}
  
   {% if home_all or 'Y' in params %}
      _HOME_Y
   {% endif %}
     
   _set_neos NEOCHAIN=bed_neo STATUS=ready
   M117

#####################################################################
[gcode_macro _HOME_X] ; sensorless homing
#####################################################################

gcode:

   ; drop motor run_currents for sensorless homing @ 0.4a 
   ; NOTE: both AB motors are needed to home single axis in Core-XY
   SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro _MY_VARIABLES"].motion_xy_home_current|default(0.4)|float}
   SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro _MY_VARIABLES"].motion_xy_home_current|default(0.4)|float}

   G28 X                                                       ; home
   M400
   G91                                                        
   G1 X-10 F10000                                              ; backoff
   G90
   G4 P500                                                     ; give StallGuard registers time to clear
    
   ; restore motor run current to printer configuration
   SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings["tmc2240 stepper_x"].run_current}
   SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings["tmc2240 stepper_y"].run_current}  

#####################################################################
[gcode_macro _HOME_Y] ; sensorless homing
#####################################################################

gcode:

   ; drop motor run_currents for sensorless homing @ 0.4a 
   ; NOTE: both AB motors are needed to home single axis in Core-XY
   SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro _MY_VARIABLES"].motion_xy_home_current|default(0.4)|float}
   SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro _MY_VARIABLES"].motion_xy_home_current|default(0.4)|float}

   G28 Y                                                       ; home
   M400
   G91      
   G1 Y-10 F10000                                              ; back off
   G90
   G4 P500                                                     ; give StallGuard registers time to clear

   ; restore motor run current to printer configuration
   SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings["tmc2240 stepper_x"].run_current}
   SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings["tmc2240 stepper_y"].run_current}  

#####################################################################
[gcode_macro _HOME_Z] ; home to endstop
#####################################################################

gcode:

    G90
    G28 Z
    G91      
    G1 Z-10 F2400                                              ; back off - do not return bed to mid point to avoid colliding with printed objects if triggered inadvertantly 