#####################################################################
; Voron Design VORON v0.2 120mm Bed, Mellow Fly D5 & 2240's @ 24v,
; Mellow Fly SHT-36 v2 & Pi 4 2GB
#####################################################################
; PIN Summary
; Bed fan                     (PC6)
; Bed Heater                  (PC7)
; Case COB LEDs               (N/A - VCC always on)
; Controller Fan              (PC9 - daisy chained)
; Stealth Skirt Fans          (PC9 - daisy chained)
; VOC Fan                     (PC8)
; Bed Thermistor              (PC0)
; Chamber Thermistor          (PC1)
; Z-STOP                      (PD2) - Note: Fly D5 X-STOP & Y-STOP share gpios with Driver0 & Driver1 diag pins
; Bed neopixel                (PA9)
; Hotend Heater               (SHT:HE0/PA8)
; Hotend Sensor               (SHT:TH0/PA3)
; Hotend Fan                  (SHT:FAN0/PB10)
; Part Fan                    (SHT:FAN1/PB11)
; Toolhead MCU/driver fan     (SHT:PROBE_2/PB1)


[mcu] ; Fly D5
canbus_uuid:                  dcec4f9752f7

[mcu sht] ; Fly Sht-36 v2 toolhead
canbus_uuid:                  6078c87b3085

[printer] 
kinematics:                   corexy
max_velocity:                 900   
max_accel:                    12000    
max_z_velocity:               80
max_z_accel:                  200
minimum_cruise_ratio:         0.20
square_corner_velocity:       10

[board_pins sht]
mcu: sht
aliases:
    EXT_EN=PA15,  EXT_STEP=PB4,  EXT_DIR=PB3,  EXT_UART=PB5,  EXT_DIAG=PB6,  ; extruder stepper
    LIMIT_0=PA1,  LIMIT_1=PA2,                                               ; end stops
    PROBE_1=PC15, PROBE_2=PB1,                                               ; probe
    FAN0=PB10,    FAN1=PB11,                                                 ; fans
    TH0=PA3,      PT1000=PB12,   TC0=PA4,                                    ; thermisters
    HE0=PA8,                                                                 ; HE0 heater 
    RGBLED=PB0,                                                              ; neopixel
    ADXL=PA9                                                                 ; adxl

[adxl345] 
cs_pin:                       sht:ADXL                          ; Fly SHT-36 adxl
spi_bus:                      spi2

[resonance_tester]
accel_chip:                   adxl345
probe_points:                 60,60,20                          ; dead centre of v0 120mm plate
accel_per_hz:                 100                               ; generate more energy for z2 x rail - Default now 60
sweeping_period:              0                                 ; revert to old klipper resonance behavour

[virtual_sdcard]
path:                         /home/pi/printer_data/gcodes
on_error_gcode:
  CANCEL_PRINT                                                  ; fail safe & always cancel the print

[pause_resume]
recover_velocity:             800

[display_status]

[exclude_object]

[respond] ; enable M118 write to console
default_prefix:


#####################################################################
[duplicate_pin_override] ; global pin overrides...only one block
#####################################################################

pins:                         PC1, PC0                          ; chamber TH, bed TH, nevermore bed and bed fan thermister link


#####################################################################
; Included configurations. Need to keep steppers and certain settings
; local as klipper expects to find and update values in printer.cfg
#####################################################################

[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
[include mysettings.cfg]                                        ; my variables and constants to use in macros  
[include hardware/*.cfg]                                        ; hardware related configuration
[include macros/*.cfg]                                          ; macros & helpers
# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[include mmu/optional/client_macros.cfg]


#####################################################################
[shaketune] ; Input shaper and belt analysis
#####################################################################
# result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep:  6
# keep_raw_data: False
# show_macros_in_webui: True
# max_freq: 200


#####################################################################
[auto_speed] ; auto printer speed analysis
#####################################################################
accel_min:                  5000     
accel_max:                  15000
velocity_min:               150                                               
velocity_max:               1500
max_missed:                 4 
derate:                     0.9                                 ; 80% default was a little conserative

#####################################################################
[idle_timeout]
#####################################################################

timeout:                    2700                                ; 45-minutes

gcode:
  M84                                                           ; explicity disable motors!
  TURN_OFF_HEATERS                                              ; explicity turn heaters off!
  M107                                                          ; turn off part fan
  _SET_NEOS NEOCHAIN=bed_neo,SHT_neos STATUS=off                ; turn neo's off


#####################################################################
; Stepper configurations
#####################################################################

[autotune_tmc stepper_x]                                        ; enable TMC autotune for X stepper  
motor:                      moons-ms14hs5p4150
sgt:                        1
pwm_freq_target:            22e3
tuning_goal:                performance
extra_hysteresis:           1

[autotune_tmc stepper_y]                                        ; enable TMC autotune for Y stepper
motor:                      moons-ms14hs5p4150
sgt:                        1
pwm_freq_target:            22e3
tuning_goal:                performance
extra_hysteresis:           1

[autotune_tmc stepper_z]                                        ; enable TMC autotune for Z Stepper
motor:                      moons-le174s-t0808-200-ar3-s-065
pwm_freq_target:            22e3
tuning_goal:                performance

;[autotune_tmc extruder]                                        ; enable TMC autotune for Extruder
;motor:                     ldo-36sth20-1004ahg


#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
[stepper_x] 
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

step_pin:                   PC15
dir_pin:                    PC14
enable_pin:                 !PC2
rotation_distance:          40
microsteps:                 32
full_steps_per_rotation:    200
endstop_pin:                tmc2240_stepper_x:virtual_endstop 
position_endstop:           120                                 ; 120mm voron 0.2 build
position_max:               120                                 ; 120mm voron 0.2 build 
position_min:               0
homing_speed:               100                                 ; sane speed for sensorless homing
homing_retract_dist:        0
homing_positive_dir:        True

[tmc2240 stepper_x]
cs_pin:                     PC13
spi_bus:                    spi2                                ; hardware SPI
rref:                       12300
interpolate:                True                                ; enable for tmc autotune
stealthchop_threshold:      0
diag0_pin:                  ^!PB4                               ; install jumper on diag for sensorless homing
;driver_SGT:                 2

; TMC2240 tune: Moons MS14HS5P4150-11(1.5A 2.2hm 3.6mH) - Target peak 0.9A
run_current:                0.8


#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
[stepper_y] 
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

step_pin:                   PA1
dir_pin:                    PA0
enable_pin:                 !PA2
rotation_distance:          40
microsteps:                 32
full_steps_per_rotation:    200
endstop_pin:                tmc2240_stepper_y:virtual_endstop
position_endstop:           120                                 ; 120mm voron 0.2 build
position_max:               120                                 ; 120mm voron 0.2 build 
position_min:               0                                   ; limit y to avoid smacking the door with yoroth 
homing_speed:               100                                 ; sane speed for sensorless homing
homing_retract_dist:        0
homing_positive_dir:        True

[tmc2240 stepper_y]
cs_pin:                     PC3
spi_bus:                    spi2                                ; hardware SPI
rref:                       12300
interpolate:                True                                ; enable for tmc autotune
stealthchop_threshold:      0 
diag0_pin:                  ^!PB3                               ; install jumper on diag for sensorless homing
;driver_SGT:                 2

; TMC2240 tune: Moons MS14HS5P4150-11(1.5A 2.2hm 3.6mH) - Target peak 0.9A
run_current:                0.8


#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
[stepper_z]
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

step_pin:                   PA5
dir_pin:                    !PA4
enable_pin:                 !PA6
rotation_distance:          8                                   ; For T8x8 integrated lead screw
microsteps:                 32
endstop_pin:                ^PD2
position_max:               120.9
position_min:               -1.5
homing_speed:               60
second_homing_speed:        3.0
homing_retract_dist:        3.0
; Adjust position of the endstop and z-offset. + to increase squish, - to reduce squish - preference to maintain here rather than in override section at end 
position_endstop:           119.8

[tmc2240 stepper_z]
cs_pin:                     PA3
spi_bus:                    spi2                                ; hardware SPI
rref:                       12300
interpolate:                False
stealthchop_threshold:      0 
;diag0_pin:                  ^PD2                               ; install jumper on diag for sensorless homing

; TMC2240 tune: Moons LE174S-T0808-200-0-S-065 (0.65A 8.7hm 15.2mH)
run_current:                0.35


#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
[extruder] ; Yavoth with Dragon Ace,
; 115W heater, PT1000 & Orbiter 2.0 extruder
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

step_pin:                   sht:EXT_STEP
dir_pin:                    sht:EXT_DIR
enable_pin:                 !sht:EXT_EN
microsteps:                 16                                  ; orbiter 2.0 
full_steps_per_rotation:    200                       
rotation_distance:          4.637                               ; orbiter 2.0 - new = previous * (measured_distance / requested_distance) - Default is 4.637
max_extrude_only_velocity:  120                                 ; orbiter 2.0
max_extrude_only_distance:  500                                 ; increase to allow filament load & unload operations
max_extrude_cross_section:  5                                   ; override to support fat purge lines and blobs

nozzle_diameter:            0.600
filament_diameter:          1.750
heater_pin:                 sht:HE0
sensor_pin:                 sht:TH0
sensor_type:                PT1000
pullup_resistor:            1100
smooth_time:                1.0
;max_power:                  0.9
min_temp:                   0
max_temp:                   310
min_extrude_temp:           190
pwm_cycle_time:             0.02506                             ; 39.9Hz - reduce flickering COB leds

pressure_advance:           0.030                               ; Dragon ACE              
pressure_advance_smooth_time: 0.04                              ; Andrew Ellis

control:                    pid                                 ; Dragon Ace (115w max, 85%) - prefer maintaining this instream rather than in override section at end
pid_Kp:                     17.611
pid_Ki:                     2.215
pid_Kd:                     35.002

[tmc2209 extruder]
uart_pin:                   sht:EXT_UART
diag_pin:                   sht:EXT_DIAG
interpolate:                True                                ; enable for tmc autotune / tune
stealthchop_threshold:      0
sense_resistor:             0.11                                ; BTT 2209 Fly-SHT v2.0

; TMC2209 tune: Orbiter 2.0 with LDO 36STH20-1004AHG (1A 2.4hm 1.2mH)
run_current:                0.5                                 ; reduced run current in heated chamber
hold_current:               0.1
driver_TBL:                 0                                   ; Orbiter tune
driver_HEND:                6                                   ; Orbiter tune
driver_HSTRT:               7                                   ; Orbiter tune
driver_TOFF:                4                                   ; Orbiter tune


#####################################################################
[bed_screws] ; manual bed leveling helper
#####################################################################

screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right


#####################################################################
[heater_bed] ; 100W Keenovo bed heater
#####################################################################

heater_pin:                 PC7
sensor_type:                Generic 3950
sensor_pin:                 PC0
smooth_time:                3.0
min_temp:                   0
max_temp:                   120
max_power:                  0.85
pwm_cycle_time:             0.02506                             ; 39.9Hz - reduce flickering COB leds
control:                    pid                                 ; preference to maintain instream rather than in override section at end
pid_kp:                     40.362                              ; calibrated with bed fan on
pid_ki:                     2.893
pid_kd:                     140.764


#####################################################################
[input_shaper]
#####################################################################

shaper_type_x   = ei                                            ; max 13720
shaper_freq_x   = 86.8
damping_ratio_x = 0.044
shaper_type_y   = mzv                                           ; max 8080
shaper_freq_y   = 52.6
damping_ratio_y = 0.044